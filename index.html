<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#16213e" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Satyagraha: The Unbroken Line</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Portrait warning banner */
    #portrait-notice {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(13, 17, 23, 0.95);
      color: #ffffff;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    #portrait-notice .icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: rotate-phone 2s infinite ease-in-out;
    }
    #portrait-notice h2 {
      font-size: 22px;
      color: #4ecca3;
      margin-bottom: 10px;
    }
    #portrait-notice p {
      font-size: 15px;
      color: #cbd5e1;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    #portrait-notice button {
      background: #4ecca3;
      color: #16213e;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
    }
    @keyframes rotate-phone {
      0%, 10% { transform: rotate(0deg); }
      50%, 60% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }
    /* Show portrait notice when in portrait on small screens */
    @media (orientation: portrait) and (max-width: 800px) {
      #portrait-notice {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="portrait-notice">
    <div class="icon">📱 🔄</div>
    <h2>Please Rotate Your Device</h2>
    <p>Hold your smartphone horizontally (Landscape) for comfortable controls and full screen view.</p>
    <button id="dismiss-rotate-btn">Play in Fullscreen ⛶</button>
  </div>

  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>

  <script>
    const dismissBtn = document.getElementById('dismiss-rotate-btn');
    if (dismissBtn) {
      dismissBtn.addEventListener('click', () => {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
        document.getElementById('portrait-notice').style.display = 'none';
      });
    }
  </script>
</body>
</html>
